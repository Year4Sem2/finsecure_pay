apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-api
  template:
    metadata:
      labels:
        app: finsecure-api
    spec:
      containers:
      - name: finsecure-api
        image: zhouyidi/finsecure-transaction-api:v1.0.0
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: finsecure-config
        # Liveness Probe: Is the app alive? If it fails, Kubernetes restarts the container.
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30  # Give Spring Boot time to start
          periodSeconds: 10
        # Readiness Probe: Is the app ready to receive traffic? If it fails, it's removed from the Service.
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5